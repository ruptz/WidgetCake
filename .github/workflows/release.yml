# Builds WidgetCake's installers for Windows, macOS and Linux and attaches them
# to a draft GitHub Release.
#
# Cut a release by pushing a tag that matches the version in package.json,
# src-tauri/Cargo.toml and src-tauri/tauri.conf.json:
#
#   git tag v0.0.1
#   git push origin v0.0.1
#
# Or run it from the Actions tab to build without releasing anything: the
# build jobs still upload their output as workflow artifacts.
#
# Nothing is code-signed, which is why the installers trip SmartScreen and
# Gatekeeper. The macOS builds are signed ad hoc, which Apple Silicon needs
# before it will run them at all. Windows is where WidgetCake is tested; the
# rest are built from the same code for people to try and report on.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default. Only the release job can write, because it creates
# the release.
permissions:
  contents: read

# One release run per tag at a time; a second push of the same tag waits
# rather than racing the first to create the release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The installers take their version from the project files, not from the tag,
  # so a tag that disagrees would ship installers named after the wrong version.
  verify:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          for v in "$pkg" "$conf" "$cargo"; do
            if [ "$tag" != "$v" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match package.json ($pkg), tauri.conf.json ($conf) and Cargo.toml ($cargo)"
              exit 1
            fi
          done
          echo "$GITHUB_REF_NAME matches"

  build:
    name: ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      # Windows is the tested platform. A failure on another must not stop it
      # shipping.
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: --bundles nsis
            files: src-tauri/target/release/bundle/nsis/*.exe
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            args: --bundles app,dmg --target aarch64-apple-darwin
            files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            args: --bundles app,dmg --target x86_64-apple-darwin
            files: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - name: linux-x64
            os: ubuntu-22.04
            args: --bundles appimage,deb
            files: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
          - name: linux-arm64
            os: ubuntu-22.04-arm
            args: --bundles appimage,deb
            files: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # No Rust cache here on purpose: a tag's cache can't be restored by the
      # next tag, so saving one would only add minutes of upload to every
      # build.

      # The web view and tray library Tauri builds against.
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # The Tauri command-line tools; the window itself has no npm packages.
      - run: npm ci

      - name: Build installer
        run: npm run build -- ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    permissions:
      contents: write
    # Runs even if one platform failed, so a broken macOS build cannot hold up a
    # working Windows one. The release is a draft — check what is attached
    # before publishing it.
    if: startsWith(github.ref, 'refs/tags/') && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installer-*
          merge-multiple: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The Linux builds arrive inside appimage/ and deb/ folders, so collect
        # the files themselves rather than whatever sits at the top level.
        run: |
          mapfile -t files < <(find installers -type f | sort)
          ls -la "${files[@]}"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --draft \
            --generate-notes \
            --title "WidgetCake $GITHUB_REF_NAME"
